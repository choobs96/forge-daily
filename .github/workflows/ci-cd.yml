name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Needed by the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- CI: runs on every PR and every push to master ----
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate cards.js (refresh-job contract)
        run: node scripts/validate-cards.mjs

      - name: Typecheck
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

      - name: Unit tests (SRS, migration, streak, session builder)
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---- CD: only on push to master, and only if validate passed ----
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
