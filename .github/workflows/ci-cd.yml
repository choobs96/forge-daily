name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Needed by the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- CI: runs on every PR and every push to master ----
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          for f in cards.js sw.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Install HTML validator
        run: npm install --no-save html-validate

      - name: Validate HTML
        run: npx html-validate "*.html"

      - name: Check service worker cache manifest
        run: |
          # Every file listed in the sw.js SHELL array must exist in the repo.
          node - <<'EOF'
          const fs = require('fs');
          const sw = fs.readFileSync('sw.js', 'utf8');
          const m = sw.match(/const\s+SHELL\s*=\s*(\[[^\]]*\])/);
          if (!m) { console.error('Could not find SHELL array in sw.js'); process.exit(1); }
          const shell = JSON.parse(m[1]);
          let missing = [];
          for (const entry of shell) {
            const p = entry === './' ? 'index.html' : entry;
            if (!fs.existsSync(p)) missing.push(entry);
          }
          if (missing.length) {
            console.error('sw.js references files that do not exist: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('All ' + shell.length + ' precached shell entries exist.');
          EOF

  # ---- CD: only on push to master, and only if validate passed ----
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (plain HTML/JS, .nojekyll present).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
