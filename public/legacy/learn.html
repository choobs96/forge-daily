<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn & Practice · Forge</title>
<style>
:root {
  --bg: #07091a; --bg-elev: #0f1330; --bg-card: #1a1f44; --bg-card-hover: #232a55;
  --border: #2a3565; --text: #ecefff; --text-dim: #a5acd0; --text-muted: #6a7299;
  --accent: #7aa2ff; --accent-2: #a78bfa; --accent-3: #f472b6;
  --green: #4ade80; --red: #f87171; --amber: #fbbf24; --xp: #a78bfa;
  --code-bg: #050816; --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.65;
  display: grid; grid-template-columns: 300px 1fr; min-height: 100vh;
}
.sidebar {
  background: var(--bg-elev); border-right: 1px solid var(--border);
  padding: 20px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand .logo {
  width: 28px; height: 28px; border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px;
}
.brand .name { font-size: 16px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-3));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.brand .tag { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.nav-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.nav-tabs a {
  flex: 1; font-size: 11px; color: var(--text-dim); text-decoration: none;
  padding: 6px 8px; border-radius: 6px; text-align: center;
  background: var(--bg-card); border: 1px solid var(--border); font-weight: 600;
}
.nav-tabs a:hover { color: var(--text); border-color: var(--accent); }
.nav-tabs a.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border: none; }
.stats-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.lvl-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.lvl-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
}
.lvl-info .title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); }
.lvl-info .rank { font-size: 13px; font-weight: 700; color: var(--text); }
.xp-bar-wrap { background: var(--border); height: 6px; border-radius: 3px; overflow: hidden; margin: 4px 0; }
.xp-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--xp), var(--accent-3));
  width: 0%; transition: width .6s;
}
.xp-label { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 10px; }
.mini-stats .ms {
  background: var(--bg-elev); padding: 6px; border-radius: 6px; text-align: center;
  border: 1px solid var(--border);
}
.mini-stats .num { font-size: 14px; font-weight: 800; }
.mini-stats .lbl { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.mini-stats .num.gold { color: var(--amber); }
.mini-stats .num.green { color: var(--green); }
.nav-section { margin-top: 8px; }
.nav-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--text-muted); font-weight: 700; margin-bottom: 6px; padding: 0 6px;
}
.nav-link {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 10px; font-size: 12.5px; color: var(--text-dim); text-decoration: none;
  border-radius: 6px; margin-bottom: 1px; cursor: pointer; transition: all .15s;
}
.nav-link:hover { background: var(--bg-card-hover); color: var(--text); }
.nav-link.active { background: var(--bg-card); color: var(--accent); }
.nav-link .check { font-size: 10px; color: var(--green); opacity: 0; }
.nav-link.completed .check { opacity: 1; }
.nav-link .mod-id { color: var(--text-muted); font-size: 10px; font-weight: 600; margin-right: 6px; }
.main { padding: 32px 48px 80px; max-width: 1000px; }
.main-header {
  position: sticky; top: 0; background: rgba(7,9,26,0.85); backdrop-filter: blur(20px);
  z-index: 40; margin: -32px -48px 24px; padding: 16px 48px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.breadcrumb { font-size: 13px; color: var(--text-muted); }
.breadcrumb .cur { color: var(--text); font-weight: 600; }
.tools { display: flex; gap: 8px; }
.tool-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
}
.tool-btn:hover { border-color: var(--accent); }
.module { display: none; animation: fadeIn .3s; }
.module.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.module-hero {
  background: linear-gradient(135deg, rgba(122,162,255,0.05), rgba(167,139,250,0.06));
  border: 1px solid var(--border); border-radius: 16px;
  padding: 28px; margin-bottom: 32px;
}
.module-eyebrow {
  display: inline-block; font-size: 10px; text-transform: uppercase;
  letter-spacing: 2px; color: var(--accent-2);
  background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3);
  padding: 3px 10px; border-radius: 12px; margin-bottom: 10px;
}
.module-hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.7px; margin-bottom: 8px; }
.module-hero p { color: var(--text-dim); font-size: 15px; }
.module-meta { display: flex; gap: 12px; margin-top: 16px; font-size: 12px; flex-wrap: wrap; }
.meta-chip {
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 12px; color: var(--text-dim);
}
.meta-chip.gold { color: var(--amber); border-color: var(--amber); }
.lesson {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
  padding: 28px; margin-bottom: 16px;
}
.lesson h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 6px; }
.lesson .lesson-num {
  font-size: 11px; color: var(--accent); text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 700; margin-bottom: 8px;
}
.lesson h3 { font-size: 16px; margin: 20px 0 8px; font-weight: 600; }
.lesson p { color: var(--text-dim); margin-bottom: 12px; font-size: 14.5px; }
.lesson ul, .lesson ol { color: var(--text-dim); padding-left: 22px; margin-bottom: 12px; }
.lesson li { margin-bottom: 4px; font-size: 14px; }
code {
  font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 13px;
  background: var(--bg-card); padding: 2px 6px; border-radius: 4px;
  color: var(--accent); border: 1px solid var(--border);
}
pre {
  background: var(--code-bg); color: #ecefff;
  padding: 16px 20px; border-radius: 8px; overflow-x: auto;
  font-size: 13px; line-height: 1.55; border: 1px solid var(--border); margin: 12px 0;
}
pre code { background: none; border: none; color: inherit; padding: 0; }
.kw { color: #f472b6; } .str { color: #a7f3d0; } .cm { color: #6a7299; font-style: italic; }
.fn { color: #93c5fd; } .num { color: #fbbf24; }
table {
  width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px;
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--bg-card); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
td { color: var(--text-dim); }
tr:last-child td { border-bottom: none; }
.callout {
  border-left: 3px solid var(--accent); background: var(--bg-card);
  padding: 14px 18px; border-radius: 6px; margin: 14px 0; font-size: 14px;
}
.callout.warn { border-color: var(--amber); }
.callout.danger { border-color: var(--red); }
.callout.success { border-color: var(--green); }
.callout-title {
  font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--accent); margin-bottom: 6px;
}
.callout.warn .callout-title { color: var(--amber); }
.callout.danger .callout-title { color: var(--red); }
.callout.success .callout-title { color: var(--green); }
.practice-block {
  background: linear-gradient(135deg, rgba(167,139,250,0.06), rgba(244,114,182,0.04));
  border: 1px solid var(--accent-2); border-radius: 16px;
  padding: 22px; margin: 24px 0; position: relative;
}
.practice-block::before {
  content: '🎯 PRACTICE'; position: absolute; top: -10px; left: 16px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
  color: white; font-size: 10px; font-weight: 700; letter-spacing: 2px;
  padding: 4px 10px; border-radius: 12px;
}
.practice-block h3 { font-size: 14px; margin-bottom: 4px; margin-top: 0; }
.practice-block .pb-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 14px; }
.problem {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
  margin-bottom: 10px; overflow: hidden; transition: all .2s;
}
.problem:hover { border-color: var(--accent); }
.problem.solved { border-color: var(--green); background: linear-gradient(135deg, var(--bg-elev), rgba(74,222,128,0.05)); }
.problem-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; cursor: pointer; gap: 12px;
}
.problem-header:hover { background: var(--bg-card-hover); }
.problem-title { font-weight: 600; font-size: 14px; flex: 1; display: flex; align-items: center; gap: 8px; }
.problem.solved .problem-title::before { content: '✓ '; color: var(--green); }
.problem-tags { display: flex; gap: 4px; }
.tag {
  font-size: 9px; padding: 2px 6px; border-radius: 4px;
  font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
}
.tag.easy { color: var(--green); border-color: var(--green); }
.tag.medium { color: var(--amber); border-color: var(--amber); }
.tag.hard { color: var(--red); border-color: var(--red); }
.problem-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); padding-top: 14px; }
.problem.open .problem-body { display: block; }
.problem-body h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--accent); margin: 12px 0 6px;
}
.problem-body h4:first-child { margin-top: 0; }
.problem-body p { color: var(--text-dim); margin-bottom: 8px; font-size: 13.5px; }
.hint-box {
  background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.3);
  border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 13px; color: var(--text-dim);
}
.hint-box::before { content: '💡 '; }
.btn-reveal, .btn-mark {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; border: none; padding: 7px 14px; border-radius: 6px;
  cursor: pointer; font-size: 12px; font-weight: 600; margin: 4px 6px 4px 0;
}
.btn-reveal.secondary { background: var(--bg-card); border: 1px solid var(--border); }
.btn-mark { background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid var(--green); }
.btn-mark:hover { background: rgba(74,222,128,0.25); }
.problem.solved .btn-mark { background: rgba(74,222,128,0.25); }
.reveal-content { display: none; }
.reveal-content.show { display: block; animation: slideIn .3s; }
@keyframes slideIn { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 2000px; } }
.quiz { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin: 18px 0; }
.quiz-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.quiz-q { font-size: 14.5px; margin-bottom: 12px; color: var(--text); }
.quiz-options { display: flex; flex-direction: column; gap: 6px; }
.quiz-opt {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; cursor: pointer; font-size: 13px; text-align: left;
  color: var(--text-dim); transition: all .15s;
}
.quiz-opt:hover { background: var(--bg-card-hover); color: var(--text); }
.quiz-opt.correct { background: rgba(74,222,128,.15); border-color: var(--green); color: var(--green); }
.quiz-opt.wrong { background: rgba(248,113,113,.15); border-color: var(--red); color: var(--red); }
.quiz-feedback { margin-top: 12px; font-size: 13px; padding: 10px 14px; border-radius: 6px; display: none; }
.quiz-feedback.show { display: block; }
.quiz-feedback.correct { background: rgba(74,222,128,.1); color: var(--green); border: 1px solid var(--green); }
.quiz-feedback.wrong { background: rgba(248,113,113,.1); color: var(--red); border: 1px solid var(--red); }
.recap {
  background: linear-gradient(135deg, rgba(122,162,255,0.08), rgba(167,139,250,0.08));
  border: 1px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 8px; padding: 20px 24px; margin: 24px 0;
}
.recap-title {
  font-weight: 700; font-size: 13px; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px;
}
.recap ul { margin: 0; padding-left: 18px; }
.recap li { color: var(--text); font-size: 13.5px; margin-bottom: 4px; }
.module-nav { display: flex; justify-content: space-between; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); }
.module-nav-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
  padding: 14px 22px; border-radius: 10px; font-size: 13px; cursor: pointer;
  font-weight: 600; text-decoration: none; display: flex; flex-direction: column;
  min-width: 200px;
}
.module-nav-btn .dir { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.module-nav-btn .title { font-size: 14px; color: var(--text); margin-top: 4px; }
.module-nav-btn:hover { border-color: var(--accent); }
.module-nav-btn.next { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; }
.module-nav-btn.next .title { color: white; }
.module-nav-btn.next .dir { color: rgba(255,255,255,0.7); }
.module-nav-btn.disabled { opacity: .3; pointer-events: none; }
.complete-btn {
  margin: 24px 0; padding: 16px 32px;
  background: linear-gradient(135deg, var(--green), #16a34a);
  color: white; border: none; border-radius: 10px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 1px; width: 100%;
  box-shadow: var(--shadow);
}
.complete-btn:hover { transform: translateY(-1px); }
.complete-btn.done {
  background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid var(--green); box-shadow: none;
}
.pop-quiz-btn {
  position: fixed; bottom: 24px; right: 24px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; border: none; padding: 14px 22px; border-radius: 50px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow); z-index: 100;
}
.pop-quiz-btn:hover { transform: scale(1.05); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 16px;
  padding: 28px; max-width: 600px; width: 100%;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.modal-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-2); font-weight: 600; }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 22px; }
.modal h3 { font-size: 16px; margin: 8px 0 16px; }
.toast {
  position: fixed; bottom: 90px; right: 24px; z-index: 150;
  background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
  color: white; padding: 12px 20px; border-radius: 30px;
  font-weight: 700; font-size: 13px; box-shadow: var(--shadow);
  transform: translateX(400px); opacity: 0;
  transition: all .4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toast.show { transform: translateX(0); opacity: 1; }
@media (max-width: 1000px) {
  body { grid-template-columns: 1fr; }
  .sidebar { position: relative; height: auto; }
  .main { padding: 24px; }
}
</style>

  <div class="brand">
    <div class="logo">F</div>

<script>
const MODULES = [
  {
    id:'m0', n:'00', title:'Roadmap & Mindset', subtitle:'Why the pivot, the muscle gap, the 12-week plan.',
    level:'Foundations', xp:50,
    lessons:[
      { title:'The three roles, disambiguated',
        content:`<p>Same SQL, different muscle. The Analytics Engineer / Data Engineer distinction comes down to <em>what you own</em>.</p>
        <table><tr><th>Role</th><th>Owns</th><th>Mental model</th></tr>
        <tr><td>Data Analyst</td><td>The question</td><td>"Why did X drop?"</td></tr>
        <tr><td><b>Analytics Engineer</b></td><td>The transformation</td><td>"Is this metric correct & reproducible?"</td></tr>
        <tr><td><b>Data Engineer</b></td><td>The plumbing</td><td>"Does data arrive on time?"</td></tr></table>
        <p>You're moving from <em>answering</em> questions to <b>building the system that lets the whole company answer them, repeatedly, correctly, fast.</b></p>` },
      { title:'What you already have',
        content:`<ul><li><b>SQL fluency</b> — joins, CTEs, windows. Lift it from "answers a question" to "models reality."</li>
        <li><b>Business context</b> — you know what a lead/contractor/renewal means. AEs spend years learning this.</li>
        <li><b>Stakeholder muscle</b> — vague ask → precise spec.</li>
        <li><b>Tool exposure</b> — Databricks, dbt, the dbt project, SF.</li></ul>` },
      { title:'What you\'re adding',
        content:`<ul><li>Modeling discipline (Kimball, SCDs, grain)</li>
        <li>Software craft (Git, PRs, modular code, tests)</li>

    statement:`Contractors × categories M:N. Design with weighted attribution.`,
    hint:`Bridge + weight col.`,
    solution:`<pre><code>bridge_contractor_category(contractor_dim_key, category_dim_key, weight, is_primary)

<span class="kw">select</span> c.cat, <span class="fn">sum</span>(f.value * b.weight) <span class="kw">from</span> fct_leads f
<span class="kw">join</span> bridge b <span class="kw">on</span> b.contractor_dim_key = f.contractor_dim_key
<span class="kw">join</span> dim_category c <span class="kw">on</span> c.category_dim_key = b.category_dim_key
<span class="kw">group by</span> c.cat;</code></pre>`,
    explain:`Weight prevents multi-counting.` },
  'mod-05':{ title:'Hybrid SCD',diff:'hard',
    statement:`50 attrs — 3 historical, 47 current. Design?`,
    hint:`Split Type 1 + Type 2.`,
    solution:`<pre><code>Option A:
- dim_contractor_current (Type 1, 47 cols)
- dim_contractor_history (Type 2, 3 cols + valid_from/to)
Facts join BOTH

Option B: Type 6 hybrid in one dim — denser but harder evolve</code></pre>`,
    explain:`Splitting is clean compromise.` },

  'sd-01':{ title:'Real-time contractor dashboard',diff:'hard',
    statement:`Median response-time vs peers, 5-min refresh. Kafka topics exist.`,
    hint:`Micro-batch, not full streaming.`,
    solution:`<pre><code>Ingest: Spark Structured Streaming, 5-min trigger → Bronze
Silver: stream-stream join + dims; compute response_seconds
Gold: 30-day rolling median per (contractor, category)
Serve: DBSQL Serverless + AI/BI dashboard
DQ: unique (contractor,lead,ts); count_delta vs 1h
Cost: 5-min micro vs streaming = 1/3 cost</code></pre>`,
    explain:`Match latency to SLO.` },
  'sd-02':{ title:'CDC pipeline',diff:'hard',
    statement:`MySQL → Delta CDC. Inserts/updates/deletes + schema evolution + DQ.`,
    hint:`Debezium → Kafka → Streaming → MERGE.`,
    solution:`<pre><code>STACK: MySQL binlog → Debezium → Kafka → Schema Registry → Spark Streaming → Bronze → MERGE → Silver

MERGE:
WHEN MATCHED AND op='d' UPDATE __is_deleted=true
WHEN MATCHED AND op IN ('c','u') UPDATE all
WHEN NOT MATCHED AND op='c' INSERT

DQ: source freshness, count silver=bronze, schema drift alert</code></pre>`,
    explain:`Bronze = replayable; Silver = current via MERGE.` },
  'sd-03':{ title:'Cost reduction',diff:'hard',
    statement:`$80K/mo, CFO wants 30% cut without SLA breach.`,
    hint:`Audit first.`,
    solution:`<pre><code>W1: audit system.compute.warehouses_costs, top 20 queries
W2 (15-20%): auto-stop, serverless dev, kill unused
W3-6 (10-15%): right-size warehouses by p95, OPTIMIZE
Structural: ML pipelines off prod, negotiate committed</code></pre>`,
    explain:`30% in 4-6 weeks. Audit prevents SLA breaks.` },
  'sd-04':{ title:'Multi-tenant isolation',diff:'hard',
    statement:`Sales mustn't see Partnership data. Enforce in UC.`,
    hint:`RBAC + dynamic views + masking.`,
    solution:`<pre><code>L1: catalog/schema RBAC
L2: Row-level dynamic views with is_account_group_member()
L3: Column masking on PII
L4: system.access.audit + monthly review</code></pre>`,
    explain:`Defense in depth.` },
  'sd-05':{ title:'DWH migration',diff:'hard',
    statement:`8TB Oracle → Lakehouse. 60 dashboards. 6 months.`,
    hint:`Dual-run + tier by usage.`,
    solution:`<pre><code>M1: Land raw in Bronze (shadow source)
M2: Query log → rank dashboards by usage → top 20 for sprint 1
M3-4: Build dbt for Tier 1; dual-run; reconcile daily; contracts
M5: Cut over Tier 1; build Tier 2
M6: Tier 3 + sunset legacy
Skip unused tables (no queries 90 days)</code></pre>`,
    explain:`Most legacy DWHs have 50% dead tables.` },
  'sd-06':{ title:'Idempotency diag',diff:'medium',
    statement:`DAG re-ran; duplicates. Diagnose + fix.`,
    hint:`INSERT vs MERGE.`,
    solution:`<pre><code>DIAGNOSE:
1. Load INSERT or MERGE?
2. Source deterministic for run_date?
3. Run_date as param or "today"?

FIX: INSERT → MERGE on unique_key, or DELETE-then-INSERT
VERIFY: rerun with same --run-date. Counts MUST match.</code></pre>`,
    explain:`Idempotency = same input → same output.` },
};

// ============= GAMIFICATION =============
const LEVELS = [
  {lvl:1,xp:0,title:'Curious Analyst'},{lvl:2,xp:100,title:'Active Learner'},
  {lvl:3,xp:250,title:'SQL Scribbler'},{lvl:4,xp:450,title:'Pattern Spotter'},
  {lvl:5,xp:700,title:'Junior Engineer Mindset'},{lvl:6,xp:1000,title:'dbt Initiate'},
  {lvl:7,xp:1350,title:'Model Builder'},{lvl:8,xp:1750,title:'Lineage Walker'},
  {lvl:9,xp:2200,title:'AE in Training'},{lvl:10,xp:2700,title:'Analytics Engineer'},
  {lvl:11,xp:3250,title:'Spark Apprentice'},{lvl:12,xp:3850,title:'Pipeline Practitioner'},
  {lvl:13,xp:4500,title:'Mid AE'},{lvl:14,xp:5200,title:'System Thinker'},
  {lvl:15,xp:6000,title:'Senior AE'},{lvl:16,xp:6900,title:'Data Engineer'},
  {lvl:17,xp:7900,title:'Senior DE'},{lvl:18,xp:9000,title:'Staff Engineer'},
  {lvl:19,xp:10300,title:'Domain Expert'},{lvl:20,xp:12000,title:'Principal · Forge Master'},
];

const POP_POOL = [
  { q:"NOT IN with NULL subquery returns?", opts:[["Zero rows",true,"NOT IN + NULL → NULL → no rows match."],["All rows",false,""],["Errors",false,""],["Same as NOT EXISTS",false,""]] },
  { q:"ROW_NUMBER PARTITION BY x ORDER BY y DESC = 1 gives?", opts:[["Latest row per x by y",true,"Canonical dedupe."],["First row",false,""],["Random",false,""],["Errors",false,""]] },
  { q:"Common CDC bug?", opts:[["Missing __is_deleted = false filter",true,"Inflates counts with tombstones."],["Wrong cluster",false,""],["Schema drift",false,""],["Slow joins",false,""]] },
  { q:"Spark transformation lazy — when executes?", opts:[["On action (show/collect/write)",true,"Actions trigger plan execution."],["Immediately",false,""],["On .cache()",false,""],["Never",false,""]] },
  { q:"Slim CI selector?", opts:[["state:modified+",true,"Changed + downstream."],["state:new",false,""],["tag:daily",false,""],["all",false,""]] },
  { q:"Best severity to introduce a new test on legacy code?", opts:[["severity: warn",true,"Log don't block."],["severity: error",false,""],["disable",false,""],["singular only",false,""]] },
  { q:"What does Delta's _delta_log enable?", opts:[["ACID + time travel + schema evolution",true,"Transaction log magic."],["Compression",false,""],["Column pruning",false,""],["Stats",false,""]] },
  { q:"Idempotency requires?", opts:[["MERGE or delete-then-insert (not raw INSERT)",true,"Same input → same output."],["Faster execution",false,""],["Larger cluster",false,""],["No deps",false,""]] },
  { q:"Star schema?", opts:[["Fact = events; dim = entities",true,""],["Fact = small; dim = big",false,""],["Fact = wide; dim = narrow",false,""],["Same",false,""]] },
  { q:"Broadcast join faster than sort-merge because?", opts:[["No shuffle — small side to all executors",true,""],["Uses indexes",false,""],["Driver-only",false,""],["Skips reads",false,""]] },
];

// ============= STATE =============
function getState() {
  return {
    completed: JSON.parse(localStorage.getItem('forge-completed')||'[]'),
    solvedIds: new Set(JSON.parse(localStorage.getItem('forge-solved-ids')||'[]')),
    xp: parseInt(localStorage.getItem('forge-xp')||'0'),
    streak: parseInt(localStorage.getItem('forge-streak')||'0'),
    lastVisit: localStorage.getItem('forge-last-visit'),
  };
}
function saveState(s) {
  localStorage.setItem('forge-completed', JSON.stringify(s.completed));
  localStorage.setItem('forge-solved-ids', JSON.stringify([...s.solvedIds]));
  localStorage.setItem('forge-solved', s.solvedIds.size);
  localStorage.setItem('forge-xp', s.xp);
  localStorage.setItem('forge-streak', s.streak);
  localStorage.setItem('forge-last-visit', s.lastVisit);
}
function calcLevel(xp) {
  let lvl = LEVELS[0], next = LEVELS[1];
  for (let i=LEVELS.length-1; i>=0; i--) {
    if (xp >= LEVELS[i].xp) { lvl = LEVELS[i]; next = LEVELS[i+1] || LEVELS[i]; break; }
  }
  return {lvl, next};
}
function updateStreak() {
  const s = getState();
  const today = new Date().toDateString();
  if (!s.lastVisit) s.streak = 1;
  else {
    const diff = (new Date(today) - new Date(s.lastVisit)) / 86400000;
    if (diff === 0) {} else if (diff === 1) s.streak += 1; else s.streak = 1;
  }
  s.lastVisit = today;
  saveState(s);
}

let currentMod = location.hash.replace('#','') || 'm0';
if (!MODULES.find(m => m.id === currentMod)) currentMod = 'm0';

function renderSidebar() {
  const state = getState();
  document.getElementById('nav-list').innerHTML = MODULES.map(m => `
    <a class="nav-link ${state.completed.includes(m.id)?'completed':''} ${m.id===currentMod?'active':''}" onclick="goto('${m.id}')">
      <span><span class="mod-id">${m.n}</span>${m.title}</span>
      <span class="check">✓</span>
    </a>`).join('');
}

function renderStats() {
  const state = getState();
  const completedXP = state.completed.reduce((s,id) => {
    const m = MODULES.find(x => x.id === id);
    return s + (m ? m.xp : 0);
  }, 0);
  state.xp = completedXP + state.solvedIds.size * 30;
  saveState(state);

  // displayed XP/level also counts Daily-swipe XP (saved forge-xp stays the base)
  const dispXp = state.xp + parseInt(localStorage.getItem('forge-swipe-xp') || '0');
  const {lvl, next} = calcLevel(dispXp);
  document.getElementById('lvl-num').textContent = lvl.lvl;
  document.getElementById('rank-title').textContent = lvl.title;
  const pct = (lvl === next) ? 100 : Math.min(100, ((dispXp - lvl.xp) / (next.xp - lvl.xp)) * 100);
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-cur').textContent = dispXp;
  document.getElementById('xp-next').textContent = (lvl === next) ? '—' : (next.xp - dispXp);
  document.getElementById('m-streak').textContent = state.streak;
  document.getElementById('m-solved').textContent = state.solvedIds.size;
  document.getElementById('m-mods').textContent = state.completed.length + '/13';
}

function sliceProblems(mod, lessonIdx) {
  if (!mod.problemIds || !mod.problemIds.length) return [];
  const per = Math.ceil(mod.problemIds.length / mod.lessons.length);
  return mod.problemIds.slice(lessonIdx * per, Math.min((lessonIdx + 1) * per, mod.problemIds.length));
}

function renderModule() {
  const state = getState();
  const mod = MODULES.find(m => m.id === currentMod);
  if (!mod) return;
  document.getElementById('bc-cur').textContent = `Module ${mod.n} · ${mod.title}`;

  const idx = MODULES.indexOf(mod);
  const prev = idx > 0 ? MODULES[idx-1] : null;
  const next = idx < MODULES.length-1 ? MODULES[idx+1] : null;
  const done = state.completed.includes(mod.id);

  document.getElementById('module-container').innerHTML = `
    <div class="module active">
      <div class="module-hero">
        <span class="module-eyebrow">Module ${mod.n}</span>
        <h1>${mod.title}</h1>
        <p>${mod.subtitle}</p>
        <div class="module-meta">
          <span class="meta-chip">${mod.level}</span>
          <span class="meta-chip gold">+${mod.xp} XP on complete</span>
          ${mod.problemIds && mod.problemIds.length ? `<span class="meta-chip">${mod.problemIds.length} problems · +${mod.problemIds.length*30} XP</span>` : ''}
        </div>
      </div>

      ${mod.lessons.map((l,i) => {
        const probs = sliceProblems(mod, i);
        return `
          <div class="lesson">
            <div class="lesson-num">Lesson ${mod.n}.${i+1}</div>
            <h2>${l.title}</h2>
            ${l.content}
          </div>
          ${probs.length ? renderPracticeBlock(probs) : ''}
        `;
      }).join('')}

      ${mod.quiz ? renderQuiz(mod) : ''}

      ${mod.recap ? `
        <div class="recap">
          <div class="recap-title">📌 Recap</div>
          <ul>${mod.recap.map(r=>`<li>${r}</li>`).join('')}</ul>
        </div>
      ` : ''}

      <button class="complete-btn ${done?'done':''}" onclick="markComplete('${mod.id}')">
        ${done ? '✓ Module Complete' : `Mark Complete (+${mod.xp} XP)`}
      </button>

      <div class="module-nav">
        ${prev ? `<a class="module-nav-btn" onclick="goto('${prev.id}')">
          <span class="dir">← Previous</span><span class="title">${prev.title}</span></a>` : '<span></span>'}
        ${next ? `<a class="module-nav-btn next" onclick="goto('${next.id}')">
          <span class="dir">Continue →</span><span class="title">${next.title}</span></a>` :
          `<span class="module-nav-btn next disabled"><span class="dir">🎉</span><span class="title">All done!</span></span>`}
      </div>
    </div>
  `;
}

function renderPracticeBlock(ids) {
  const state = getState();
  return `<div class="practice-block">
    <h3>Practice these now</h3>
    <p class="pb-desc">Try each against your warehouse / notebook. Reveal solutions when done; mark solved for +30 XP each.</p>
    ${ids.map(id => {
      const p = PROBLEMS[id];
      if (!p) return '';
      const solved = state.solvedIds.has(id);
      return `<div class="problem ${solved?'solved':''}" id="prob-${id}">
        <div class="problem-header" onclick="toggleProb(this)">
          <div class="problem-title">${p.title}</div>
          <div class="problem-tags"><span class="tag ${p.diff}">${p.diff}</span></div>
        </div>
        <div class="problem-body">
          <h4>Problem</h4>
          <p>${p.statement}</p>
          <button class="btn-reveal secondary" onclick="reveal(this,'hint-${id}')">💡 Hint</button>
          <button class="btn-reveal" onclick="reveal(this,'sol-${id}')">🔓 Solution</button>
          <button class="btn-mark" onclick="markSolved('${id}',this)">${solved?'✓ Solved':'Mark solved (+30 XP)'}</button>
          <div class="reveal-content" id="hint-${id}"><div class="hint-box">${p.hint}</div></div>
          <div class="reveal-content" id="sol-${id}"><h4>Solution</h4>${p.solution}<h4>Why this works</h4><p>${p.explain}</p></div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderQuiz(mod) {
  return `<div class="quiz">
    <div class="quiz-title">🧠 Check Your Understanding</div>
    <div class="quiz-q">${mod.quiz.q}</div>
    <div class="quiz-options">
      ${mod.quiz.opts.map(([t,c,e]) => `<button class="quiz-opt" onclick="answerQuiz(this,${c},'${e.replace(/'/g,"\\'")}')">${t}</button>`).join('')}
    </div>
    <div class="quiz-feedback"></div>
  </div>`;
}

function toggleProb(h) { h.parentElement.classList.toggle('open'); }
function reveal(btn, id) {
  const el = document.getElementById(id);
  el.classList.toggle('show');
  btn.textContent = el.classList.contains('show')
    ? (id.startsWith('hint') ? '🔒 Hide hint' : '🔒 Hide solution')
    : (id.startsWith('hint') ? '💡 Hint' : '🔓 Solution');
}
function markSolved(id, btn) {
  const state = getState();
  if (state.solvedIds.has(id)) {
    state.solvedIds.delete(id);
    btn.textContent = 'Mark solved (+30 XP)';
    document.getElementById(`prob-${id}`).classList.remove('solved');
  } else {
    state.solvedIds.add(id);
    btn.textContent = '✓ Solved';
    document.getElementById(`prob-${id}`).classList.add('solved');
    showToast('+30 XP');
  }
  saveState(state);
  renderStats();
}
function answerQuiz(btn, isCorrect, feedback) {
  const quiz = btn.closest('.quiz');
  quiz.querySelectorAll('.quiz-opt').forEach(o => o.disabled = true);
  btn.classList.add(isCorrect ? 'correct' : 'wrong');
  const fb = quiz.querySelector('.quiz-feedback');
  fb.textContent = feedback;
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  if (isCorrect) showToast('+10 XP');
}
function markComplete(id) {
  const state = getState();
  const mod = MODULES.find(m => m.id === id);
  if (state.completed.includes(id)) {
    state.completed = state.completed.filter(x => x !== id);
  } else {
    state.completed.push(id);
    showToast(`+${mod.xp} XP · Module Complete!`);
  }
  saveState(state);
  renderSidebar();
  renderModule();
  renderStats();
}
function resetProgress() {
  if (confirm('Reset all progress?')) {
    localStorage.clear();
    location.reload();
  }
}
function goto(id) {
  currentMod = id;
  location.hash = '#' + id;
  renderSidebar();
  renderModule();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

let lastPop = -1;
function popQuiz() {
  let idx;
  do { idx = Math.floor(Math.random() * POP_POOL.length); } while (idx === lastPop);
  lastPop = idx;
  const q = POP_POOL[idx];
  document.getElementById('modal-q').textContent = q.q;
  const opts = document.getElementById('modal-options');
  opts.innerHTML = '';
  const fb = document.getElementById('modal-feedback');
  fb.classList.remove('show','correct','wrong');
  fb.textContent = '';
  [...q.opts].sort(() => Math.random() - 0.5).forEach(([text, isCorrect, explain]) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = text;
    btn.onclick = () => {
      opts.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      fb.textContent = explain;
      fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
    };
    opts.appendChild(btn);
  });
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

updateStreak();
renderSidebar();
renderModule();
renderStats();
</script>

<div id="__fb" style="position:fixed;left:12px;bottom:12px;z-index:9999;display:flex;gap:6px;opacity:.45;transition:opacity .2s" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.45">
  <button onclick="__fbExport()" title="Export progress" style="width:34px;height:34px;border-radius:8px;border:1px solid #2a3565;background:#1a1f44;color:#a5acd0;font-size:15px;cursor:pointer">&#8595;</button>
  <button onclick="document.getElementById('__fbFile').click()" title="Import progress" style="width:34px;height:34px;border-radius:8px;border:1px solid #2a3565;background:#1a1f44;color:#a5acd0;font-size:15px;cursor:pointer">&#8593;</button>
</div>
<input type="file" id="__fbFile" accept="application/json" style="display:none" onchange="__fbImport(event)">
<script>
function __fbSnap(){var s={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('forge-')===0)s[k]=localStorage.getItem(k);}return s;}
function __fbExport(){var b=new Blob([JSON.stringify(__fbSnap(),null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='forge-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();}
function __fbImport(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);Object.keys(o).forEach(function(k){if(k.indexOf('forge-')===0)localStorage.setItem(k,o[k]);});location.reload();}catch(x){alert('Invalid backup file');}};r.readAsText(f);}
</script>
</body>
